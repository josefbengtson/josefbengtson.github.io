# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Josef Bengtson
name: Josef Bengtson
position: PhD Student, Chalmers University of Technology
email: bengtson.josef@gmail.com
description: |
  I am a PhD student in the Computer Vision group at
  [Chalmers University of Technology](https://www.chalmers.se/en/) in Gothenburg, Sweden, supervised by
  Fredrik Kahl. My PhD is funded by the
  [Wallenberg AI, Autonomous Systems and Software Program (WASP)](https://wasp-sweden.org/).

  I work on 3D vision and generative models, with a focus on 3D editing and sparse-view
  reconstruction. I work with 3D Gaussian Splatting, feed-forward 3D reconstruction, and
  diffusion and flow models for novel view synthesis. A common thread is multi-view and 3D consistency, so that generated or edited content
  agrees across viewpoints.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://josefbengtson.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: josefbengtson
google_scholar: wjNsZRkAAAAJ # the user= part of your Google Scholar profile URL
show_portrait: false # set to true once images/portrait.jpg (square, ~600x600) is a real photo

permalink: pretty # serves cv.html at /cv/

# Build settings
plugins:
  - jekyll-feed
  - jekyll-tailwindcss

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      math: false

