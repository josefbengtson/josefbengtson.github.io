- id: gemnr
  title: "GeM-NR: Geometry-Aware Multi-View Editing for Nonrigid Scene Changes"
  venue: BMVC, 2026
  description: "A fast, training-free method that propagates an edit made on one image with any 2D editor to the other views, including edits that drastically change the scene geometry."
  project_page: https://gem-nr.github.io
  arxiv: 2606.05142
  github: GeM-NR/gemnr
